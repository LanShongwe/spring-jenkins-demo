<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot + Jenkins Demo</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 640px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            line-height: 1.6;
            color: #1f2937;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 2rem;
            background: #f9fafb;
        }
        code {
            background: #e5e7eb;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="'Hello, ' + ${name} + '!'">Hello, World!</h1>
        <p>Your modern Spring Boot 3 application built and started successfully.</p>
        <p><strong>Server Time:</strong> <span th:text="${timestamp}"></span></p>
        <p>API Health Check: <a href="/api/status"><code>/api/status</code></a></p>
    </div>
</body>
</html>
